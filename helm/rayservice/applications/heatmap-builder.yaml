- name: heatmap-builder
  import_path: builders.heatmap_builder:app
  route_prefix: /heatmap-builder
  runtime_env:
    working_dir: https://github.com/RationAI/model-service/archive/3ea57f1efca9be7eee8e1e7a61fd88a21dc324b1.zip
  deployments:
    - name: HeatmapBuilder
      max_ongoing_requests: 16
      max_queued_requests: 128
      autoscaling_config:
        min_replicas: 0
        max_replicas: 4
        target_ongoing_requests: 8
      ray_actor_options:
        num_cpus: 8
        memory: 12884901888
      user_config:
        num_threads: 16
        max_concurrent_tasks: 64
