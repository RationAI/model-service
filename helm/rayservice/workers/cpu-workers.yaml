groupName: cpu-workers
replicas: 0
minReplicas: 0
maxReplicas: 2
template:
  spec:
    securityContext:
      fsGroupChangePolicy: OnRootMismatch
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: ray-worker
        image: cerit.io/rationai/model-service:2.55.0
        imagePullPolicy: Always
        resources:
          limits:
            cpu: 8
            memory: 16Gi
          requests:
            cpu: 8
            memory: 16Gi
        env:
          - name: HTTPS_PROXY
            value: http://proxy.ics.muni.cz:3128
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsUser: 1000
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "ray stop"]
        volumeMounts:
          - name: data
            mountPath: {{ .Values.pvcs.data.mountPath }}
          - name: public-data
            mountPath: {{ .Values.pvcs.publicData.mountPath }}
          - name: projects
            mountPath: {{ .Values.pvcs.projects.mountPath }}
          - name: bioptic-tree
            mountPath: {{ .Values.pvcs.biopticTree.mountPath }}
          - name: trt-cache-volume
            mountPath: {{ .Values.pvcs.tensorrtCache.mountPath }}
          - name: huggingface-cache
            mountPath: {{ .Values.pvcs.huggingface.mountPath }}
    volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Values.pvcs.data.claimName }}
      - name: public-data
        persistentVolumeClaim:
          claimName: {{ .Values.pvcs.publicData.claimName }}
      - name: projects
        persistentVolumeClaim:
          claimName: {{ .Values.pvcs.projects.claimName }}
      - name: bioptic-tree
        persistentVolumeClaim:
          claimName: {{ .Values.pvcs.biopticTree.claimName }}
      - name: trt-cache-volume
        persistentVolumeClaim:
          claimName: {{ .Values.pvcs.tensorrtCache.claimName }}
      - name: huggingface-cache
        persistentVolumeClaim:
          claimName: {{ .Values.pvcs.huggingface.claimName }}
